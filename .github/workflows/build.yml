name: build

on:
  pull_request:
  workflow_dispatch:
  push:
    branches:
      - main
      - stable/**

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      packages: write
      pull-requests: write
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - uses: vexxhost/docker-atmosphere/.github/actions/checkout@c2a2333f668bfbf131bd2a7aa8c387be80f0ea85 # main
        with:
          repository: openstack/tempest
          ref: 9831863ccfea824ddf9a8e24e546fa9ec822bc0e # 47.0.0

      - uses: vexxhost/docker-atmosphere/.github/actions/checkout@c2a2333f668bfbf131bd2a7aa8c387be80f0ea85 # main
        with:
          repository: openstack/barbican-tempest-plugin
          ref: f370cf0ee9e72ada0f48bf80360b7de851444b8e # master

      - uses: vexxhost/docker-atmosphere/.github/actions/checkout@c2a2333f668bfbf131bd2a7aa8c387be80f0ea85 # main
        with:
          repository: openstack/cinder-tempest-plugin
          ref: 34fb7539a7a7c0e9e1632b90ac678a9950a17473 # master

      - uses: vexxhost/docker-atmosphere/.github/actions/checkout@c2a2333f668bfbf131bd2a7aa8c387be80f0ea85 # main
        with:
          repository: openstack/heat-tempest-plugin
          ref: 80a32f85477ab497bd489aa32b05e80755d08b5a # master

      - uses: vexxhost/docker-atmosphere/.github/actions/checkout@c2a2333f668bfbf131bd2a7aa8c387be80f0ea85 # main
        with:
          repository: openstack/keystone-tempest-plugin
          ref: a027c11ac8ce3972f387d5a316cfce16665203bd # master

      - uses: vexxhost/docker-atmosphere/.github/actions/checkout@c2a2333f668bfbf131bd2a7aa8c387be80f0ea85 # main
        with:
          repository: openstack/neutron-tempest-plugin
          ref: ff954cc158a690d95d79cbb72b61a1da637f840d # master

      - uses: vexxhost/docker-atmosphere/.github/actions/checkout@c2a2333f668bfbf131bd2a7aa8c387be80f0ea85 # main
        with:
          repository: openstack/octavia-tempest-plugin
          ref: 15209727e071ed83bbbfe2fe6694c1282215ed33 # master

      - uses: vexxhost/docker-atmosphere/.github/actions/build-image@c2a2333f668bfbf131bd2a7aa8c387be80f0ea85 # main
        with:
          image-name: tempest
          build-contexts: |
            tempest=openstack/tempest
            barbican-tempest-plugin=openstack/barbican-tempest-plugin
            cinder-tempest-plugin=openstack/cinder-tempest-plugin
            heat-tempest-plugin=openstack/heat-tempest-plugin
            keystone-tempest-plugin=openstack/keystone-tempest-plugin
            neutron-tempest-plugin=openstack/neutron-tempest-plugin
            octavia-tempest-plugin=openstack/octavia-tempest-plugin
          push: ${{ github.event_name != 'pull_request' }}
