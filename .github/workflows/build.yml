name: build

on:
  pull_request:
  workflow_dispatch:
  push:
    branches:
      - main
      - stable/**

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      packages: write
      pull-requests: write
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - uses: vexxhost/docker-atmosphere/.github/actions/checkout@15f30aa3f1fff75915cf230d19e00a54324d6ec7 # main
        with:
          repository: openstack/tempest
          ref: 9831863ccfea824ddf9a8e24e546fa9ec822bc0e # 47.0.0

      - uses: vexxhost/docker-atmosphere/.github/actions/checkout@15f30aa3f1fff75915cf230d19e00a54324d6ec7 # main
        with:
          repository: openstack/barbican-tempest-plugin
          ref: 2cd185133a86242c58d721e66c2db753a369fe60 # master

      - uses: vexxhost/docker-atmosphere/.github/actions/checkout@15f30aa3f1fff75915cf230d19e00a54324d6ec7 # main
        with:
          repository: openstack/cinder-tempest-plugin
          ref: 1357d5dccffc2cd6c1e8a13e84c065d5bd55e4d5 # master

      - uses: vexxhost/docker-atmosphere/.github/actions/checkout@15f30aa3f1fff75915cf230d19e00a54324d6ec7 # main
        with:
          repository: openstack/heat-tempest-plugin
          ref: 1ce78d2eba96678955e3be10096fc239b08ba809 # master

      - uses: vexxhost/docker-atmosphere/.github/actions/checkout@15f30aa3f1fff75915cf230d19e00a54324d6ec7 # main
        with:
          repository: openstack/keystone-tempest-plugin
          ref: bab7165ee8aef4abb796db587299c773bc105ee1 # master

      - uses: vexxhost/docker-atmosphere/.github/actions/checkout@15f30aa3f1fff75915cf230d19e00a54324d6ec7 # main
        with:
          repository: openstack/neutron-tempest-plugin
          ref: e190b3649745ad36c4d421d29aa7f21caba213b0 # master

      - uses: vexxhost/docker-atmosphere/.github/actions/checkout@15f30aa3f1fff75915cf230d19e00a54324d6ec7 # main
        with:
          repository: openstack/octavia-tempest-plugin
          ref: 2f3e8a379573dc8c7cb13a5395f55ba00790fe59 # master

      - uses: vexxhost/docker-atmosphere/.github/actions/build-image@15f30aa3f1fff75915cf230d19e00a54324d6ec7 # main
        with:
          image-name: tempest
          build-contexts: |
            tempest=openstack/tempest
            barbican-tempest-plugin=openstack/barbican-tempest-plugin
            cinder-tempest-plugin=openstack/cinder-tempest-plugin
            heat-tempest-plugin=openstack/heat-tempest-plugin
            keystone-tempest-plugin=openstack/keystone-tempest-plugin
            neutron-tempest-plugin=openstack/neutron-tempest-plugin
            octavia-tempest-plugin=openstack/octavia-tempest-plugin
          push: ${{ github.event_name != 'pull_request' }}
